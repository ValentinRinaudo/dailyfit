<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Fit</title>
<meta name="description" content="Daily streetwear outfits from your own closet, planned for today's weather.">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="wordmark">Daily Fit</div>
      <div class="label" id="dateLabel"></div>
    </div>
    <div class="row" style="gap:8px;flex-wrap:nowrap">
      <button type="button" class="addbtn" id="addBtn" aria-label="Add pieces or looks"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" class="avatar" id="avatarBtn" aria-label="Your space"></button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button type="button" data-tab="today" aria-current="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button type="button" data-tab="closet"><svg class="icon" viewBox="0 0 24 24"><path d="M12 6a2 2 0 1 1 2 2c-1 .3-2 1-2 2v.5"/><path d="M12 10.5 3.5 17a1.4 1.4 0 0 0 .9 2.5h15.2a1.4 1.4 0 0 0 .9-2.5L12 10.5Z"/></svg>Closet</button>
  <button type="button" data-tab="shop"><svg class="icon" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</button>
  <button type="button" data-tab="you"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>You</button>
</div></nav>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileLib" accept="image/*" multiple hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="data.js"></script>
<script src="color.js"></script>
<script src="art.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
